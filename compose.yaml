# Environnement de DÉVELOPPEMENT.
# Le moteur est MySQL 8.4 : les migrations Doctrine du projet sont écrites en
# SQL MySQL (AUTO_INCREMENT, TINYINT, utf8mb4). Le développement, la recette et
# la production utilisent le même moteur — principe de parité des environnements.
services:
  database:
    image: mysql:${MYSQL_VERSION:-8.4}
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cesizen}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-app}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-p${MYSQL_ROOT_PASSWORD:-root}']
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - database_data:/var/lib/mysql:rw

volumes:
  database_data:
