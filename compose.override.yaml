# Surcharges appliquées uniquement en développement local
# (docker compose les charge automatiquement en plus de compose.yaml).
services:
  database:
    ports:
      - '3306:3306'

  mailer:
    image: axllent/mailpit
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # interface web : http://localhost:8025
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
