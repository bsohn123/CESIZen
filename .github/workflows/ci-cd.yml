name: CI/CD CESIZen

# Déclencheurs : toute pull request est contrôlée, develop part en recette,
# une étiquette v*.*.* déclenche la mise en production après validation manuelle.
on:
  push:
    branches: [main, develop]
    tags: ['v*.*.*']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  packages: write

env:
  PHP_VERSION: '8.3'

jobs:
  # ---------------------------------------------------------------------------
  # 1. Qualité — norme de code et analyse statique
  # ---------------------------------------------------------------------------
  qualite:
    name: 1 · Qualité du code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Installation de PHP et des outils
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_mysql, intl, gd, zip
          tools: composer:v2
          coverage: none

      - name: Vérification de la syntaxe PHP
        run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Emplacement du cache Composer
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - run: composer install --no-interaction --prefer-dist --no-progress

      # Bloquants depuis la normalisation de la base de code (voir docs/adr/0002).
      # Les deux outils sont verrouillés dans composer.lock et exécutés depuis
      # vendor/bin : la CI et les postes de développement analysent avec la même
      # version, une montée de version ne peut plus rougir la chaîne par surprise.
      - name: Norme PSR-12 (php-cs-fixer)
        run: vendor/bin/php-cs-fixer check --diff --config=.php-cs-fixer.dist.php

      - name: Analyse statique (PHPStan)
        run: vendor/bin/phpstan analyse --configuration=phpstan.dist.neon --no-progress

  # ---------------------------------------------------------------------------
  # 2. Secrets — détection dans le code et dans l'historique
  # ---------------------------------------------------------------------------
  secrets:
    name: 2 · Détection de secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # L'historique complet est nécessaire à la seconde passe.
          fetch-depth: 0

      # Passe 1 — l'arbre de travail. BLOQUANTE : aucun secret ne doit entrer
      # dans le code aujourd'hui. --no-git analyse les fichiers tels quels,
      # indépendamment des commits.
      - name: Secrets dans le code (bloquant)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect --source=/repo --config=/repo/.gitleaks.toml --no-git --redact --verbose

      # Passe 2 — l'historique complet. NON BLOQUANTE, délibérément.
      #
      # Des identifiants de service de courriel ont été versionnés par le passé
      # (V01, issue #19). Ils restent lisibles dans l'historique Git, et
      # réécrire l'historique d'un dépôt public ne les efface ni des copies
      # déjà faites, ni des caches de GitHub. La seule réponse valable est de
      # les RÉVOQUER.
      #
      # Cette passe n'est donc pas là pour être corrigée par une modification
      # du code, mais pour rappeler à chaque exécution que la révocation reste
      # à faire. Elle redeviendra bloquante une fois l'issue #19 close.
      - name: Secrets dans l'historique (rappel, non bloquant)
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect --source=/repo --config=/repo/.gitleaks.toml --redact --verbose

  # ---------------------------------------------------------------------------
  # 3. Sécurité — vulnérabilités connues des dépendances (V08)
  # ---------------------------------------------------------------------------
  securite:
    name: 3 · Sécurité des dépendances
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_mysql, intl, gd, zip
          tools: composer:v2
          coverage: none

      - run: composer install --no-interaction --prefer-dist --no-progress

      # Échoue si une dépendance est concernée par un avis de sécurité publié.
      #
      # Trois tentatives, mais uniquement en cas d'erreur de transport : le
      # 25/08/2026, l'API des avis de packagist.org a renvoyé un 502 et la chaîne
      # est passée au rouge alors qu'aucune dépendance n'était en cause. Un code
      # de retour autre que 100 signale de vrais avis : on echoue immediatement,
      # sans jamais retenter — le garde-fou doit rester intransigeant.
      - name: Audit des dépendances
        shell: bash
        run: |
          tentative=1
          while [ "$tentative" -le 3 ]; do
            composer audit --no-interaction && exit 0
            code=$?
            if [ "$code" -ne 100 ]; then
              echo "::error::composer audit signale des avis de sécurité (code $code)."
              exit "$code"
            fi
            echo "::warning::packagist.org injoignable (tentative $tentative/3), nouvel essai dans 15 s."
            sleep 15
            tentative=$((tentative + 1))
          done
          echo "::error::packagist.org reste injoignable après 3 tentatives."
          exit 100

  # ---------------------------------------------------------------------------
  # 4. Tests — suite fonctionnelle sur une vraie base MySQL
  # ---------------------------------------------------------------------------
  tests:
    name: 4 · Tests fonctionnels
    runs-on: ubuntu-latest
    needs: [qualite, secrets, securite]
    services:
      database:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: cesizen_test
          MYSQL_USER: app
          MYSQL_PASSWORD: app
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: 'mysql://root:root@127.0.0.1:3306/cesizen?serverVersion=8.4.0&charset=utf8mb4'
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_mysql, intl, gd, zip
          # pcov : mesure de couverture, nettement plus rapide que Xdebug.
          coverage: pcov

      - name: Emplacement du cache Composer
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Préparation de la base de test
        run: |
          php bin/console doctrine:database:create --if-not-exists --env=test
          php bin/console doctrine:migrations:migrate --no-interaction --env=test

      - name: Ressources front-end
        run: php bin/console importmap:install

      # Aucun seuil bloquant pour l'instant : le pourcentage est affiché dans le
      # journal pour servir de point de départ. Un seuil sera fixé une fois la
      # valeur de référence connue.
      - name: Suite de tests et couverture
        run: php bin/phpunit --coverage-text

  # ---------------------------------------------------------------------------
  # 5. Audit dynamique — l'application réellement démarrée
  # ---------------------------------------------------------------------------
  # Les autres contrôles lisent le code. Celui-ci interroge l'application en
  # marche : en-têtes réellement publiés, comportement réel des formulaires,
  # cookies réellement posés. C'est le seul qui teste ce qui est servi.
  zap:
    name: 5 · Audit dynamique (ZAP)
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v7

      - name: Construction de l'image à auditer
        run: |
          REPO="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE_REPO=$REPO" >> "$GITHUB_ENV"
          docker build -t "ghcr.io/$REPO:zap" .

      # Les identifiants sont générés à la volée et ne servent qu'à ce job :
      # aucun secret du dépôt n'est nécessaire, et rien n'est écrit ailleurs
      # que sur l'exécuteur, détruit à la fin.
      - name: Démarrage de la composition
        run: |
          MYSQL_PW="$(openssl rand -hex 16)"
          {
            echo "SERVER_NAME=http://localhost"
            echo "TLS_EMAIL=zap@example.test"
            echo "APP_SECRET=$(openssl rand -hex 32)"
            echo "APP_VERSION=zap"
            echo "GITHUB_REPOSITORY=$IMAGE_REPO"
            echo "MYSQL_DATABASE=cesizen"
            echo "MYSQL_USER=cesizen"
            echo "MYSQL_PASSWORD=$MYSQL_PW"
            echo "MYSQL_ROOT_PASSWORD=$(openssl rand -hex 16)"
            echo "DATABASE_URL=mysql://cesizen:$MYSQL_PW@database:3306/cesizen?serverVersion=8.4.0&charset=utf8mb4"
            echo "REDIS_PASSWORD=$(openssl rand -hex 16)"
            echo "MAILER_DSN=null://null"
            echo "MAILER_FROM=zap@example.test"
          } > .env.zap
          # GITHUB_REPOSITORY est une variable intégrée de GitHub Actions, et
          # Compose donne priorité à l'environnement du shell sur --env-file :
          # sans cette surcharge explicite, la casse d'origine (CESIZen)
          # l'emporte et Docker refuse la référence, un nom d'image devant être
          # entièrement en minuscules.
          GITHUB_REPOSITORY="$IMAGE_REPO" \
            docker compose -f compose.prod.yaml --env-file .env.zap up -d --scale app=2

      - name: Attente de la sonde de santé
        run: |
          for i in $(seq 1 60); do
            if curl -fsS --max-time 3 http://localhost/health >/dev/null 2>&1; then
              echo "Application prête après $((i * 2)) s."
              exit 0
            fi
            sleep 2
          done
          echo "::error::L application n a pas démarré en 120 s."
          GITHUB_REPOSITORY="$IMAGE_REPO" docker compose -f compose.prod.yaml --env-file .env.zap logs --tail=50
          exit 1

      # fail_action reste à false pour cette première mise en place : un scan
      # dynamique sur une application jamais auditée ainsi remonte toujours du
      # bruit. Les alertes sont relevées, triées, puis certaines deviendront
      # bloquantes — décider avant d avoir vu les résultats n aurait pas de sens.
      - name: Scan ZAP (baseline)
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
          fail_action: false

      - name: Arrêt de la composition
        if: always()
        run: GITHUB_REPOSITORY="$IMAGE_REPO" docker compose -f compose.prod.yaml --env-file .env.zap down -v --remove-orphans

  # ---------------------------------------------------------------------------
  # 6. Construction — image applicative unique, réutilisée en recette et en prod
  # ---------------------------------------------------------------------------
  build:
    name: 6 · Construction de l'image
    runs-on: ubuntu-latest
    # Declarer des permissions au niveau du job REMPLACE le jeu global : les
    # deux permissions deja necessaires doivent donc etre repetees ici.
    permissions:
      contents: read
      packages: write
      # Publication du rapport Trivy dans l onglet Security du depot.
      security-events: write
    needs: tests
    if: github.event_name == 'push'
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Authentification au registre GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # L image analysee est celle qui vient d etre publiee, pas une image
      # reconstruite pour l occasion : c est bien l artefact deployable qui est
      # examine.
      #
      # ignore-unfixed est delibere : echouer sur une faille sans correctif
      # disponible ne ferait que maintenir la chaine au rouge sans qu aucune
      # action ne soit possible. Seules les failles corrigeables bloquent.
      - name: Analyse de l image (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: sarif
          output: trivy.sarif

      # Publie meme si Trivy a echoue : le rapport est justement ce qui permet
      # de savoir quoi corriger.
      - name: Publication du rapport dans l onglet Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif

  # ---------------------------------------------------------------------------
  # 7. Recette — déploiement automatique à chaque fusion sur develop
  # ---------------------------------------------------------------------------
  recette:
    name: 7 · Déploiement en recette
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop'
    environment:
      name: recette
      url: https://recette.cesizen.fr
    steps:
      - name: Déploiement sur l'environnement de recette
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.RECETTE_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: /opt/cesizen-recette/deploy.sh develop

  # ---------------------------------------------------------------------------
  # 8. Production — étiquette v* + validation manuelle dans GitHub
  # ---------------------------------------------------------------------------
  production:
    name: 8 · Déploiement en production
    runs-on: ubuntu-latest
    # La publication de la note de version cree une release : contents: write est
    # requis. La permission globale reste en lecture, seul ce job est releve.
    permissions:
      contents: write
      packages: read
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    # L'environnement « production » est protégé dans les réglages du dépôt :
    # un examinateur doit approuver le déploiement avant son exécution.
    environment:
      name: production
      url: https://cesizen.fr
    steps:
      - name: Déploiement sur le VPS de production
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: /opt/cesizen/deploy.sh ${{ github.ref_name }}

      - name: Publication de la note de version
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
