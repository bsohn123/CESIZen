# V08 — surveillance automatique des dépendances.
# Dependabot ouvre une pull request dès qu'une mise à jour est disponible et
# une alerte de sécurité dès qu'une CVE touche une dépendance du projet.
version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    labels: ['type:technique', 'dependances']
    commit-message:
      prefix: 'chore(deps)'
    groups:
      symfony:
        patterns: ['symfony/*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: ['type:technique']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    labels: ['type:technique']
