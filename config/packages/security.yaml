security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # used to reload user from session & other features (e.g. switch_user)
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                always_use_default_target_path: true
                default_target_path: app_home
            # V02 — limitation des tentatives de connexion (bourrage d'identifiants).
            # 5 tentatives par minute et par adresse IP, et par couple IP + identifiant.
            login_throttling:
                max_attempts: 5
                interval: '1 minute'
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 86400 # V12 — 24 h au lieu de 7 jours
                path: /
                always_remember_me: false
                secure: true # V12 — cookie transmis uniquement en HTTPS
                httponly: true # V12 — inaccessible au JavaScript
                samesite: strict # V12 — non transmis depuis un site tiers
            logout:
                path: app_logout
                # where to redirect after logout
                target: app_login

    access_control:
    - { path: ^/profile, roles: ROLE_USER }
    - { path: ^/suivi-personnel, roles: ROLE_USER }
    - { path: ^/admin, roles: ROLE_ADMIN }

when@test:
    security:
        password_hashers:
            # Coût de hachage minimal : accélère la suite de tests fonctionnels.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
        firewalls:
            main:
                # Le compteur de tentatives est partagé par adresse IP : en test,
                # toutes les requêtes viennent de 127.0.0.1. Le seuil est relevé
                # pour que les tests ne se bloquent pas mutuellement ; la présence
                # et le câblage de la protection sont vérifiés par
                # SecurityHardeningTest::testLoginThrottlingIsEnabled().
                login_throttling:
                    max_attempts: 100
                    interval: '1 minute'
                remember_me:
                    secure: false
