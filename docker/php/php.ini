; Réglages PHP de production — CESIZen

; --- Sécurité -------------------------------------------------------------
; Ne jamais afficher d'erreur à l'utilisateur : une trace d'exception révèle
; des chemins, des versions et parfois des extraits de requête SQL.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
; Ne pas annoncer la version de PHP dans les en-têtes HTTP.
expose_php = Off
; Interdit l'ouverture d'URL distantes par les fonctions de fichiers.
allow_url_fopen = Off
allow_url_include = Off

; --- Téléversement --------------------------------------------------------
; Aligné sur la limite applicative de 5 Mo (ImageSanitizer::MAX_BYTES).
upload_max_filesize = 6M
post_max_size = 8M
max_file_uploads = 5

; --- Ressources -----------------------------------------------------------
memory_limit = 256M
max_execution_time = 30

; --- Performance ----------------------------------------------------------
opcache.enable = 1
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.preload_user = www-data
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; --- Sessions -------------------------------------------------------------
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = "Lax"
session.use_strict_mode = 1

date.timezone = Europe/Paris
